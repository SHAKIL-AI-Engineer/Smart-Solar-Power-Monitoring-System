# Opt-in SQL Server development deployment; set SQLSERVER_PASSWORD in the shell.
services:
  api:
    environment:
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=SolarEms;User Id=sa;Password=${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD};TrustServerCertificate=true"
    depends_on:
      sqlserver:
        condition: service_healthy
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD}
    volumes:
      - solar-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  solar-sql:
